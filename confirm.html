<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="ltg-practice" content="1">
<title>先着予約確認（練習）｜れんしゅうチケット</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>
<div class="ph">れんしゅうチケット<small>練習用の架空のサイト</small></div>
<main>
  <h1>先着予約確認</h1>
  <table class="sum">
    <tr><td>公演</td><td>サンプルバンド HALL TOUR（練習）</td></tr>
    <tr><td>日時</td><td id="when"></td></tr>
    <tr><td>席種・枚数</td><td id="seat"></td></tr>
    <tr><td>引取方法</td><td>電子チケット</td></tr>
    <tr><td>支払方法</td><td id="pay"></td></tr>
  </table>
  <p class="filler">内容をご確認ください。ここは本物と同じように、ボタンが画面の下の方にあります。</p>
  <div class="filler"><p>【キャンセルについて】お申し込み後のキャンセルはできません。</p><p>【お知らせメール】出演者・ジャンルのお知らせを受け取る設定は、練習では使いません。</p></div>
  <button type="button" id="ENTRY_FIX" name="ENTRY_FIX" class="Button -primary"></button>
  <button type="button" id="MTHD_CHG" name="MTHD_CHG" class="Button">戻る</button>
</main>
<script>
(() => {
  const cart = P.get('cart', null) || {};
  const pay = P.get('payment', '02');
  const payName = { '15': 'PayPay', '16': '楽天ペイ', '02': 'クレジットカード', '03': '店頭入金', '12': 'd払い' }[pay] || '';
  document.getElementById('when').textContent = `${cart.disp || ''} 開演${cart.start || ''}`;
  document.getElementById('seat').textContent = `${cart.seatName || '全席指定'} ￥${cart.price || '8,800'} × ${cart.count || '?'}枚`;
  document.getElementById('pay').textContent = payName;
  const fix = document.getElementById('ENTRY_FIX');
  const credit = pay === '02';
  fix.textContent = credit ? 'クレジットカード番号入力' : '申し込む';
  fix.addEventListener('click', () => {
    P.mark(`先着予約確認の「${fix.textContent}」`);
    location.href = credit ? 'credit.html' : 'done.html';
  });
  document.getElementById('MTHD_CHG').addEventListener('click', () => { location.href = 'payment.html'; });
})();
</script>
</body>
</html>
