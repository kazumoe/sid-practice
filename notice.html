<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="ltg-practice" content="1">
<title>ご案内｜れんしゅうチケット</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<style>.msg{color:#c2507a;font-size:17px;line-height:1.8;margin:24px 0 40px}.back{background:#5a87a6;color:#fff;border:0;border-radius:6px;width:100%;padding:16px;font-size:18px}</style>
</head>
<body>
<div class="ph">れんしゅうチケット<small>練習用の架空のサイト</small></div>
<main>
  <p class="msg">誠に申し訳ありませんが、予約枚数終了のため、お席が確保できませんでした。</p>
  <a class="back" id="back" href="order.html?gLcode=99999" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">戻る</a>
</main>
<script>
  // 本物と同じく、「戻る」はリンクで、行き先のURLに選んだ日程（c_SEARCH_TICKET_DATA）が入っている。
  // そのまま押すと、取れなかった席の枚数画面が開き直される（11/15 SPYAIR で確認。案内版 v1.9.5 以降は行き先をそろえる）
  (() => {
    const cart = P.get('cart', null) || {};
    const data = { pf_key: [cart.key || ''], pf_date: [cart.ymd || ''], seat_type_cd: [cart.seatCd || '001'], tkt_cnt: [[cart.count || '1']] };
    document.getElementById('back').setAttribute('href', P.orderUrl() + '&c_SEARCH_TICKET_DATA=' + encodeURIComponent(JSON.stringify(data)));
  })();
</script>
</body>
</html>
